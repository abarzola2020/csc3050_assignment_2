<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Legends</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Top 3 Football Legends in history</h1>
    
    <div class="card-grid">
      <article class="card">
        <img src="https://static.dw.com/image/61527609_803.jpg" alt="Pelé 3 WC">
        <h2>Pelé</h2>
        <button class="toggle_btn">Info</button>
        <p class="info hidden">Won 3 World Cups with Brazil.</p>
      </article>

      <article class="card">
        <img src="https://i0.wp.com/thesefootballtimes.co/wp-content/uploads/2017/03/maradona86.jpg?fit=1600%2C1053&ssl=1" alt="Diego Maradona 1 time legendary WC">
        <h2>Maradona</h2>
        <button class="toggle_btn">Info</button>
        <p class="info hidden">Won the 1986 World Cup with Argentina.</p>
      </article>

      <article class="card">
        <img src="https://i2-prod.manchestereveningnews.co.uk/incoming/article24090059.ece/ALTERNATES/s1200/0_GettyImages-963682418.jpg" alt="Cristiano Ronaldo">
        <h2>Ronaldo</h2>
        <button class="toggle_btn">Info</button>
        <p class="info hidden">5 Champions League Top Scorer in history.</p>
      </article>
    </div>
  </main>
</body>
</html>
